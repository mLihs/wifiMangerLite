name=wifiMangerLite
version=3.0.1
author=martinlihs
maintainer=martinlihs
sentence=A lightweight, modular WiFi connection manager for ESP32 with web-based captive portal and NVS storage.
paragraph=Features automatic WiFi connection with retry logic, fallback AP mode with beautiful captive portal web UI, dual SSID support, static IP configuration, BSSID lock, mDNS, event callbacks, pluggable logger/configuration interfaces, built-in NVS storage using MessagePack, and extension points for custom modules. Non-blocking operation with ZERO heap fragmentation - Config uses fixed char[] arrays instead of Arduino String.
category=Communication
url=
architectures=esp32
includes=src/wifiMangerLite.h
depends=ArduinoJson,NVSUtilityLibrary
