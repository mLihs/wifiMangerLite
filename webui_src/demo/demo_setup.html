<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
  <title>Demo - Advanced Setup</title>
  <!-- Direct links to CSS for easy editing -->
  <link rel="stylesheet" href="../common.css"/>
  <link rel="stylesheet" href="../advanced.css"/>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="page-header">
      <h1>WiFi Setup</h1>
      <div class="subtitle">Configure your network connection</div>
    </div>

    <!-- Network Selection Card -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <div class="card-title-icon" style="background-image: var(--icon-wifi)"></div>
          Available Networks
        </div>
        <button type="button" class="icon-btn" onclick="refreshNetworks()" title="Refresh">
          <div class="icon icon-refresh"></div>
        </button>
      </div>
      <div id="networks" class="network-list">
        <!-- Networks will be populated by JavaScript -->
      </div>
    </div>

    <!-- WiFi Configuration Card -->
    <form id="wifiForm" action="#" method="POST" class="card" onsubmit="handleSubmit(event)">
      <div class="card-title">
        <div class="card-title-icon" style="background-image: var(--icon-settings)"></div>
        WiFi Configuration
      </div>

      <label for="devicename">Device Name</label>
      <input type="text" id="devicename" name="devicename" placeholder="My ESP Device" value="ESP-Demo-Device" autocomplete="off" required/>

      <label for="ssid0">SSID</label>
      <input type="text" id="ssid0" name="ssid0" placeholder="Network name" autocomplete="off"/>
      <input type="hidden" id="bssid0" name="bssid0"/>

      <label class="toggle-row">
        <span>Lock to selected BSSID</span>
        <div class="toggle-switch">
          <input type="checkbox" id="bssidLock" name="bssidLock" value="1"/>
          <span class="toggle-slider"></span>
        </div>
      </label>

      <label for="password0">Password</label>
      <input type="password" id="password0" name="password0" placeholder="Network password" autocomplete="new-password"/>

      <div class="section-divider">Fallback Network</div>

      <label for="ssid1">Fallback SSID</label>
      <input type="text" id="ssid1" name="ssid1" placeholder="Optional backup network" autocomplete="off"/>

      <label for="password1">Password</label>
      <input type="password" id="password1" name="password1" placeholder="Fallback password" autocomplete="new-password"/>

      <div class="section-divider">Static IP (Optional)</div>

      <label for="ip">IP Address</label>
      <input type="text" id="ip" name="ip" placeholder="192.168.1.100"/>

      <label for="subnet">Subnet Mask</label>
      <input type="text" id="subnet" name="subnet" placeholder="255.255.255.0"/>

      <label for="gateway">Gateway</label>
      <input type="text" id="gateway" name="gateway" placeholder="192.168.1.1"/>

      <label for="dns">DNS Server</label>
      <input type="text" id="dns" name="dns" placeholder="8.8.8.8"/>
    </form>
    
    <!-- Buttons (outside card) -->
    <div class="button-stack">
      <button type="submit" form="wifiForm" class="btn btn-large btn-cta">Save &amp; Connect</button>
      <button type="button" class="btn btn-large btn-secondary" onclick="doReset()">Reset WiFi</button>
      <button type="button" class="btn btn-large btn-danger" onclick="doFactoryReset()">Factory Reset</button>
    </div>

    <!-- Footer -->
    <div class="page-footer">
      WiFiManagerLite v2.5.0 - Demo Mode
    </div>
  </div>

  <!-- Toast Backdrop -->
  <div id="toast-backdrop"></div>
  
  <!-- Toast Notification -->
  <div id="toast">
    <div id="toast-icon" class="spinner"></div>
    <div id="toast-title"></div>
    <div id="toast-msg"></div>
  </div>

  <script>
    // ============================================
    // Mock WiFi Networks for Demo
    // ============================================
    const mockNetworks = [
      { ssid: "HomeNetwork_5G",      bssid: "AA:BB:CC:DD:EE:01", rssi: -42, enc: true },
      { ssid: "HomeNetwork_2.4G",    bssid: "AA:BB:CC:DD:EE:02", rssi: -55, enc: true },
      { ssid: "Office_Secure",       bssid: "11:22:33:44:55:01", rssi: -58, enc: true },
      { ssid: "Neighbor_WiFi",       bssid: "11:22:33:44:55:02", rssi: -68, enc: true },
      { ssid: "CoffeeShop_Free",     bssid: "11:22:33:44:55:03", rssi: -72, enc: false },
      { ssid: "Guest_Network",       bssid: "11:22:33:44:55:04", rssi: -78, enc: true },
      { ssid: "IoT_Devices",         bssid: "11:22:33:44:55:05", rssi: -82, enc: true },
      { ssid: "Garage_AP",           bssid: "11:22:33:44:55:06", rssi: -88, enc: true },
      { ssid: "",                    bssid: "99:99:99:99:99:99", rssi: -92, enc: true },  // Hidden
    ];

    let selectedSSID = '';
    let selectedBSSID = '';

    // ============================================
    // Signal Strength to CSS Class
    // ============================================
    function getSignalClass(rssi) {
      if (rssi >= -50) return 'strength-100';
      if (rssi >= -60) return 'strength-75';
      if (rssi >= -70) return 'strength-50';
      return 'strength-25';
    }

    // ============================================
    // Generate WiFi Signal HTML
    // ============================================
    function signalHTML(rssi) {
      const cls = getSignalClass(rssi);
      return `<div class="wifi-signal ${cls}">
        <div class="wifi-bar"></div>
        <div class="wifi-bar"></div>
        <div class="wifi-bar"></div>
        <div class="wifi-bar"></div>
      </div>`;
    }

    // ============================================
    // Load Networks (with mock scanning delay)
    // ============================================
    function loadNetworks() {
      const container = document.getElementById('networks');
      
      // Show scanning state
      container.innerHTML = `
        <div class="network empty">
          <div style="width:32px;height:32px;background:var(--icon-spinner) no-repeat center/contain"></div>
          <span>Scanning...</span>
        </div>`;

      // Simulate scan delay
      setTimeout(() => {
        container.innerHTML = '';
        
        // Sort by signal strength
        const sorted = [...mockNetworks].sort((a, b) => b.rssi - a.rssi);
        
        sorted.forEach(n => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'network';
          btn.innerHTML = `
            ${signalHTML(n.rssi)}
            <div class="network-info">
              <div class="ssid">${n.ssid || '(hidden network)'}</div>
              <div class="network-meta">
                ${n.rssi} dBm
                ${!n.enc ? '<span style="color:var(--accent-green)">Open</span>' : ''}
              </div>
            </div>
            ${n.enc ? '<span class="lock-icon network-lock"></span>' : ''}
          `;

          btn.onclick = function() {
            // Deselect all
            document.querySelectorAll('.network').forEach(el => el.classList.remove('selected'));
            this.classList.add('selected');

            selectedSSID = n.ssid || '';
            selectedBSSID = n.bssid || '';

            // Update form fields
            document.getElementById('ssid0').value = selectedSSID;
            document.getElementById('bssid0').value = selectedBSSID;

            // Focus password field
            document.getElementById('password0').focus();
          };

          container.appendChild(btn);
        });
      }, 800);
    }

    // ============================================
    // Refresh Networks
    // ============================================
    function refreshNetworks() {
      loadNetworks();
    }

    // ============================================
    // Toast Notification
    // ============================================
    function toast(type, title, msg) {
      const t = document.getElementById('toast');
      const b = document.getElementById('toast-backdrop');
      const icon = document.getElementById('toast-icon');
      
      icon.className = type;
      document.getElementById('toast-title').textContent = title;
      document.getElementById('toast-msg').textContent = msg || '';
      
      t.classList.add('show');
      b.classList.add('show');
      
      if (type !== 'spinner') {
        setTimeout(() => {
          t.classList.remove('show');
          b.classList.remove('show');
        }, 3000);
      }
    }

    // ============================================
    // Form Submit Handler (Demo)
    // ============================================
    function handleSubmit(e) {
      e.preventDefault();
      
      const ssid = document.getElementById('ssid0').value;
      const deviceName = document.getElementById('devicename').value;
      
      if (!ssid) {
        toast('error', 'Error', 'Please select a network');
        return;
      }
      
      toast('spinner', 'Saving...', `Connecting ${deviceName} to ${ssid}`);
      
      // Simulate connection
      setTimeout(() => {
        toast('success', 'Configuration Saved!', `Device will restart and connect to ${ssid}`);
      }, 2000);
    }

    // ============================================
    // Reset Functions (Demo)
    // ============================================
    function doReset() {
      toast('spinner', 'Resetting...', 'Clearing WiFi settings');
      setTimeout(() => {
        toast('success', 'WiFi Reset', 'Settings cleared. Device will restart.');
      }, 1500);
    }

    function doFactoryReset() {
      if (confirm('Are you sure you want to factory reset? All settings will be lost.')) {
        toast('spinner', 'Factory Reset...', 'Erasing all data');
        setTimeout(() => {
          toast('success', 'Factory Reset Complete', 'Device will restart.');
        }, 2000);
      }
    }

    // ============================================
    // Initialize
    // ============================================
    document.addEventListener('DOMContentLoaded', loadNetworks);
  </script>
</body>
</html>
