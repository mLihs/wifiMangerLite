<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Error</title>
  <style>
    /* ============================================
       Response Page Styles (Homewind Design)
       Edit these to customize the error page
       ============================================ */
    
    /* Background */
    body {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #8D9EB9;
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    
    /* Card Container */
    .card {
      background: #EEF2FA;
      border-radius: 24px;
      padding: 48px;
      text-align: center;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 0 24px rgba(0,0,0,0.1);
    }
    
    /* Icon Circle */
    .icon {
      width: 64px;
      height: 64px;
      background: #F00F66;  /* Pink/Red for error */
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 32px;
      height: 32px;
      fill: #fff;
    }
    
    /* Typography */
    h1 {
      color: #132237;
      font-size: 24px;
      margin: 0 0 8px;
    }
    p {
      color: #516682;
      margin: 0;
      line-height: 1.5;
    }
    
    /* Link */
    a {
      color: #F00F66;  /* Pink accent */
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Error Icon (X) -->
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </div>
    
    <!-- Message -->
    <h1>Configuration Error</h1>
    <p>Settings were rejected.<br><a href="/">Try Again</a></p>
  </div>
</body>
</html>
